<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Loop Password</title>
<link rel="icon" href="icon.png">
<style>
  :root { --bg:#fafafa; --card:#fff; --ink:#111; --soft:#666; --line:#e2e2e2; --btn:#111; --btnInk:#fff; --bad:#c0392b; --good:#1e8e3e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0b; --card:#161616; --ink:#f2f2f2; --soft:#9a9a9a; --line:#2a2a2a; --btn:#fff; --btnInk:#111; --bad:#ff8a80; --good:#7ee2a0; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; padding:16px; }
  main { width:min(400px,100%); text-align:center; }
  img { width:72px; height:72px; border-radius:16px; }
  h1 { font-size:26px; margin:14px 0 6px; letter-spacing:-.01em; }
  p { color:var(--soft); margin:0 0 22px; }
  form { display:grid; gap:10px; }
  input { width:100%; padding:13px 16px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; }
  button { padding:13px; border-radius:999px; border:0; background:var(--btn); color:var(--btnInk); font:inherit; font-weight:700; cursor:pointer; }
  button[disabled] { opacity:.5; }
  #msg { min-height:24px; margin-top:14px; font-size:15px; }
  .bad { color:var(--bad); } .good { color:var(--good); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Loop app icon">
  <h1>Choose a new password</h1>
  <p>Then go back to Loop on your Mac and sign in with it.</p>
  <form id="f">
    <input id="pw" type="password" placeholder="New password (8+ characters)" autocomplete="new-password" minlength="8" required>
    <input id="pw2" type="password" placeholder="Type it again" autocomplete="new-password" minlength="8" required>
    <button id="go" type="submit">Save new password</button>
  </form>
  <div id="msg" role="status"></div>
</main>
<script>
  // Loop's account service. This key is public by design: it only allows what each signed-in person may do.
  var URL_ = "https://ebnygrqnymvfdhbvryof.supabase.co", KEY = "sb_publishable_rb3EYJkM7aZenWD8vM3yPA_NUVa4UTB";
  var h = new URLSearchParams(location.hash.slice(1)), token = h.get('access_token');
  var msg = document.getElementById('msg'), f = document.getElementById('f');
  var say = function (t, cls) { msg.textContent = t; msg.className = cls || ''; };
  if (h.get('error_description')) { say(h.get('error_description').replace(/\+/g, ' ') + '. Ask Loop for a new reset email.', 'bad'); f.hidden = true; }
  else if (!token) { say('Open this page from the reset link in your email.', 'bad'); f.hidden = true; }
  history.replaceState(null, '', location.pathname);
  f.onsubmit = function (e) {
    e.preventDefault();
    var a = document.getElementById('pw').value, b = document.getElementById('pw2').value;
    if (a !== b) return say("Those passwords don't match.", 'bad');
    var go = document.getElementById('go'); go.disabled = true; say('');
    fetch(URL_ + '/auth/v1/user', { method: 'PUT', headers: { apikey: KEY, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify({ password: a }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (r) {
        if (r.ok) { f.hidden = true; say('Your password is changed. Go back to Loop and sign in.', 'good'); }
        else { go.disabled = false; say((r.j && (r.j.msg || r.j.message)) || 'That link has expired. Ask Loop for a new reset email.', 'bad'); }
      }, function () { go.disabled = false; say('Check your internet connection and try again.', 'bad'); });
  };
</script>
</body>
</html>
